         # Remove all obs with QualityMarker > 3
         - filter: RejectList
           identifier:
             name: QcMarkerCheck
             logging: true
             diagnostic flag new: false
           filter variables:
           - name: airTemperature
           where:
           - variable: QualityMarker/airTemperature
             is_in: 4-15
             value: is_not_valid
           where operator: or
           action:
             name: reduce obs space

