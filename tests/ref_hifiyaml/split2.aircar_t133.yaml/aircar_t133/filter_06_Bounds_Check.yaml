         # Online regional domain check
         - filter: Bounds Check
           apply at iterations: 0,1
           identifier:
             name: RegionalDomainCheck
             logging: true
             diagnostic flag new: false
           filter variables:
           - name: airTemperature
           test variables:
           - name:  GeoVaLs/observable_domain_mask
           minvalue: 0.0
           maxvalue: 0.5

